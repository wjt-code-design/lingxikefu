[alembic]
# migration scripts location (relative to backend/)
script_location = alembic

# ensure `app` package importable from backend/ (single source of truth is config.py)
prepend_sys_path = .

# DB URL is injected by alembic/env.py from app.core.config.settings (single source).
# Leave empty here to avoid a second default value (red line #9).
sqlalchemy.url =

# migration file name template
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# P4：mypy 宽松基线——先让工具可用、错误可查，再按模块渐进收紧。
# 收紧节奏建议：先开 check_untyped_defs → 再开 disallow_untyped_defs（新代码强制注解）。
[mypy]
python_version = 3.11
files = app
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = False
disallow_untyped_defs = False
disallow_any_generics = False

# mypy 的 INI 不支持跨行括号续写（解析报错），exclude 需单行正则表达式
exclude = ^\.venv/
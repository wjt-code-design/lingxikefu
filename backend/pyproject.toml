[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-backend"
version = "0.2.0"
description = "Lingxi 智能客服系统后端（FastAPI + SQLAlchemy + RAG）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "PyJWT>=2.8,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.1,<5.0",
    "celery[redis]>=5.3,<6.0",
    "qdrant-client>=1.9,<2.0",
    "litellm>=1.40,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70"
asyncio_mode = "auto"
# PyJWT 对 <32 字节测试 key 的警告（真实 secret 应≥32，生产由 settings 校验；测试 key 刻意短则忽略噪音）
filterwarnings = ["ignore:.*HMAC key is .* bytes long.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP035"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]

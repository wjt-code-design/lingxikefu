# Lingxi 智能客服系统 · 本地一键起（api + migrate + postgres + redis + qdrant + worker）
# 用法：
#   1) cp .env.example .env 并填入真实值（JWT_SECRET 等必须替换占位）
#   2) docker compose up --build
# 说明：所有敏感项用 ${VAR:-default} 形式，保证 `docker compose config` 可校验；
#       启动时 app.settings.validate() fail-closed，占位/缺失配置会直接拒绝启动。
name: lingxi

x-api-environment: &api-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-lingxi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-__CHANGE_ME__}
  POSTGRES_DB: ${POSTGRES_DB:-lingxi}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-__CHANGE_ME__}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-__CHANGE_ME__}
  TENANT_DEFAULT: ${TENANT_DEFAULT:-default}
  CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-__CHANGE_ME__}
      POSTGRES_DB: ${POSTGRES_DB:-lingxi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingxi} -d ${POSTGRES_DB:-lingxi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:

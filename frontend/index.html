<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵犀 · Lingxi 智能客服</title>
    <script>
      // 防闪烁（FOUC）：首帧渲染前根据持久化主题设置 <html data-theme>
      // key 必须与 store/themeStore.ts 的 persist name 一致：lingxi-theme
      (function () {
        try {
          var raw = localStorage.getItem('lingxi-theme');
          var t = raw ? JSON.parse(raw).state.theme : 'system';
          var dark = false; // 柔和档（原 dark 语义废除，仅驱动浅色变体 data-theme）
          if (t === 'dark') {
            dark = true;
          } else if (t === 'system') {
            dark = !!(
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            );
          }
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

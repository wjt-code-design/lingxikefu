<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵犀 · 智能客服</title>
    <meta name="description" content="灵犀智能客服 - 基于知识库的 7×24 小时智能问答系统，支持转人工客服、工单跟踪、知识溯源" />
    <meta name="keywords" content="智能客服,知识库,在线客服,转人工,工单系统,灵犀" />
    <!-- Open Graph -->
    <meta property="og:title" content="灵犀 · 智能客服" />
    <meta property="og:description" content="基于知识库的 7×24 小时智能问答系统，解决不了？一键转人工客服" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Fonts (with fallback for China mainland) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // 主题首帧兜底（防 FOUC）：读 zustand persist 的 lingxi-theme + OS 深浅偏好，
      // 在 React 挂载前把 data-theme 写到 <html>（与 useTheme/index 兜底逻辑一致）。
      (function () {
        try {
          var mode = 'light';
          var raw = localStorage.getItem('lingxi-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) mode = parsed.state.theme;
          }
          var resolved =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

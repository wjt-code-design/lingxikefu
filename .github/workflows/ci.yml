# Lingxi CI：后端 lint(ruff) → 单测(pytest) → 前端(tsc+vitest+静态尺) → e2e(Playwright+axe) → secret 扫描 → 构建镜像
# 红线⑨：day1 必须有 CI + 单测基线；禁止提交真实密钥/endpoint。
#
# 评测门禁（花钱那部分）已于 2026-09-27 拆到 .github/workflows/eval.yml：
# 留在本文件里会让"只改 CI 管线"的 push 也触发付费 LongCat 抽样（每次 ≈¥0.6-1），
# 于是接 lint/接静态尺这类零信号改动每次都要付钱，门禁就退化成"靠人记得本机跑"。
# 改本文件 = 免费；改 backend/** / contracts/** / eval-and-samples/** / eval.yml = 跑评测。
#
# ⚠️ 2026-08-23 修复"幻影 CI"：本文件此前位于 backend/.github/workflows/——GitHub Actions
# 只读仓库根的 .github/workflows/，导致全部 4 个 job 从未在远端执行过（硬编码密钥与
# ruff 违规得以推上远端而"CI 绿线"毫无反应）。移至根目录并补上前端 job。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 手动重跑整条管线（不跑评测）。全量评测入口在 "Eval" workflow 里。
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # 锁定已验证版本：浮动范围会被新版 ruff 的新规则打破（2026-08-22 曾全仓翻红）
        run: pip install "ruff==0.16.4"
      - name: Ruff check
        run: ruff check app tests alembic scripts
      # B2-6：评测基线冻结清单完整性校验（防判定脚本/评测集被改后 CI 仍绿的假绿防线）。
      # 纯标准库、秒级完成，挂 lint（每次 push 必跑，不受 eval job 路径过滤影响）。
      # 2026-09-06 引入即抓到既有漏登：ground-truth.md @6561047 改后未同步 hash。
      - name: Baseline integrity (BASELINE.sha256)
        working-directory: .
        run: python scripts/check_baseline_hashes.py

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    # A1：真实基础设施 services（PG/Redis/Qdrant）——此前 CI 无 services，
    # pytest 在 runner 上连 localhost 必失败，所有测试验证只能靠本机。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      # CI 测试专用密钥（非生产）：config.validate() fail-closed 要求 JWT_SECRET 非空非占位符，
      # 缺失会导致 app.main import 即抛 ValueError，pytest collection 崩（run#2 已实证）
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        run: alembic upgrade head
      # bge 预下载：seed_demo_data 与部分 pytest 需本地 embedding（bge-base-zh-v1.5），
      # 全新 runner 无 HF 缓存且 embedding.py 以离线加载，缺缓存会 LocalEntryNotFoundError 秒崩
      # （2026-08-27 实测 seed 阶段 8 处 huggingface 报错）。本 step 与 eval job 同款，不得设 HF_HUB_OFFLINE。
      - name: Pre-download embedding model (bge-base-zh-v1.5)
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-base-zh-v1.5'); print('bge model cached OK')"
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
      # 订单集成回归（test_demo_orders.py）需要 KB 有订单 demo 数据；全新空库下脚本自动建 demo KB。
      # 幂等（sha256 去重），可安全在每次 CI 前执行。
      - name: Seed demo KB order data
        run: python scripts/seed_demo_data.py
      - name: Run tests (coverage >= 70%)
        run: pytest
      # 契约门禁：根 contracts/api.ts vs api-schema.json 一致（防漂移静默回归，纯标准库脚本）
      - name: Contract check (check_contracts.py)
        run: python ../scripts/check_contracts.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: backend/coverage.xml

  # T2：迁移 down/up 对称性验证——此前 CI 只验 fresh upgrade（test job），
  # downgrade 路径从未在任何受控环境跑过（生产第一次回滚才是首跑=高危盲区）。
  # 独立空库 PG 上 upgrade→downgrade(-1)→re-upgrade 循环，并硬断言终态回到 head；
  # downgrade 用相对 -1 不写死版本号，新增迁移时本 job 零维护。
  migrations:
    name: Migration down/up symmetry (PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one revision
        run: alembic downgrade -1
      - name: Re-upgrade and assert back at head
        run: |
          alembic upgrade head
          # 断言终态 revision=head（而非仅命令退出码 0）；alembic 改输出格式时此处可见地红
          alembic current | grep -q "(head)" \
            || { echo "::error::re-upgrade 未回到 head"; exit 1; }

  secret-scan:
    name: Secret scan (gitleaks 等价)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          SECRET_PATTERNS = [
              re.compile(r"sk-[A-Za-z0-9]{20,}"),                    # OpenAI-style keys
              re.compile(r"AKIA[0-9A-Z]{16}"),                       # AWS access key id
              re.compile(r"sk_live_[A-Za-z0-9]{20,}"),               # Stripe live keys
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY"),  # private keys
          ]
          SKIP_SUFFIXES = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".lock", ".woff", ".woff2"}

          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if any(part.startswith(".") and part != ".github" for part in path.parts):
                  continue  # 跳过 .git/.venv 等
              if path.suffix.lower() in SKIP_SUFFIXES or not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for lineno, line in enumerate(content.splitlines(), 1):
                  if any(p.search(line) for p in SECRET_PATTERNS):
                      hits.append(f"{path}:{lineno}")

          if hits:
              print("::error::疑似真实密钥泄漏（请改用 secret 注入）:")
              for h in hits:
                  print(f"  - {h}")
              sys.exit(1)

          # .env.example 的 JWT_SECRET 必须是占位符
          env_example = pathlib.Path("backend/.env.example")
          if env_example.exists():
              text = env_example.read_text(encoding="utf-8")
              for key in ("JWT_SECRET",):
                  bad = [ln for ln in text.splitlines()
                         if ln.startswith(f"{key}=") and not ln.endswith("__CHANGE_ME__")]
                  if bad:
                      print(f"::error::{key} 必须为占位符 __CHANGE_ME__: {bad}")
                      sys.exit(1)

          print("OK: 未发现真实密钥，.env.example 全为占位符")
          PY

  frontend:
    name: Frontend (tsc + vitest + 静态尺)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # 以下三把此前只在本机手动跑（靠人记得）——2026-09-26 一轮 a11y 审查的结论正是
      # "静态尺只算白底色对 + 不进 CI"导致对比度问题反复静默复发，故一次接齐。
      # max-warnings=0：仓库最后一条既有 warning（ChatContainer 缺 navigate 依赖）已修掉，
      # 不设阈值等于给新 warning 留门。
      - name: Lint (eslint, 0 warnings allowed)
        run: npx eslint src --max-warnings=0
      - name: Token sync (tokens.css ↔ theme.ts)
        run: npm run check:tokens
      - name: A11y contrast (前景 × 实际底色矩阵)
        run: npm run check:a11y

  # e2e：真浏览器跑登录态全路由 axe（含 jsdom 判不了的 color-contrast / target-size）+ 触摸目标实测。
  # 为什么要配齐后端：D9 首轮探针用同一枚轮换制 refreshToken 复用，19 条路由里 16 条其实停在
  # /login，axe 审的是登录页却报 0 违规——"登录态取证"必须有真号可登，故这里灌种子账号 + 起 uvicorn。
  # 免费：不碰评测面（花钱门禁在 eval.yml），且 e2e 全程不发消息（发消息=打 LongCat=付费，
  # 也会把 MessageBubble 的 nested-interactive 引进来，那是 D10 未决的设计取舍）。
  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    # 排在 frontend 之后：tsc/vitest 都过不去就别浪费一次浏览器下载
    needs: [frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        working-directory: backend
        run: alembic upgrade head
      # 种子账号口令与 `frontend/e2e/fixtures.ts` 的 E2E_PASSWORD 常量同值（一次性库，出库即无意义）。
      # 脚本对缺 env 直接 exit 2，防止误往开发库灌号。
      - name: Seed e2e accounts
        working-directory: backend
        run: E2E_PASSWORD='e2e-not-a-secret-2026' python scripts/seed_e2e_accounts.py
      - name: Start API (background)
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      # 显式等 /health：后端没起来时让日志说话，而不是把原因藏在 Playwright 的"停在 /login"里
      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && { echo "API ready (${i} probes)"; exit 0; }
            sleep 2
          done
          echo "::error::后端 80s 未就绪"
          tail -40 /tmp/api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, frontend, e2e, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: lingxi-backend:ci
      # docker-compose 的 api/migrate/worker 引用 env_file `- .env`（被 gitignore，CI 不存在），
      # 直接 compose config 会因缺文件报错。用 .env.example（全占位符）生成一个仅用于语法校验。
      - name: Prep .env for compose validation
        working-directory: backend
        run: cp .env.example .env
      - name: Validate docker-compose
        working-directory: backend
        run: docker compose config --quiet

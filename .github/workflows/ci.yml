# Lingxi CI：后端 lint(ruff) → 单测(pytest) → 前端(tsc+vitest) → secret 扫描 → 构建镜像
# 红线⑨：day1 必须有 CI + 单测基线；禁止提交真实密钥/endpoint。
#
# ⚠️ 2026-08-23 修复"幻影 CI"：本文件此前位于 backend/.github/workflows/——GitHub Actions
# 只读仓库根的 .github/workflows/，导致全部 4 个 job 从未在远端执行过（硬编码密钥与
# ruff 违规得以推上远端而"CI 绿线"毫无反应）。移至根目录并补上前端 job。
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # 锁定已验证版本：浮动范围会被新版 ruff 的新规则打破（2026-08-22 曾全仓翻红）
        run: pip install "ruff==0.16.4"
      - name: Ruff check
        run: ruff check app tests alembic scripts

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    # A1：真实基础设施 services（PG/Redis/Qdrant）——此前 CI 无 services，
    # pytest 在 runner 上连 localhost 必失败，所有测试验证只能靠本机。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        run: alembic upgrade head
      # 订单集成回归（test_demo_orders.py）需要 KB 有订单 demo 数据；全新空库下脚本自动建 demo KB。
      # 幂等（sha256 去重），可安全在每次 CI 前执行。
      - name: Seed demo KB order data
        run: python scripts/seed_demo_data.py
      - name: Run tests (coverage >= 70%)
        run: pytest
      # 契约门禁：根 contracts/api.ts vs api-schema.json 一致（防漂移静默回归，纯标准库脚本）
      - name: Contract check (check_contracts.py)
        run: python ../scripts/check_contracts.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: backend/coverage.xml

  # T2：迁移 down/up 对称性验证——此前 CI 只验 fresh upgrade（test job），
  # downgrade 路径从未在任何受控环境跑过（生产第一次回滚才是首跑=高危盲区）。
  # 独立空库 PG 上 upgrade→downgrade(-1)→re-upgrade 循环，并硬断言终态回到 head；
  # downgrade 用相对 -1 不写死版本号，新增迁移时本 job 零维护。
  migrations:
    name: Migration down/up symmetry (PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one revision
        run: alembic downgrade -1
      - name: Re-upgrade and assert back at head
        run: |
          alembic upgrade head
          # 断言终态 revision=head（而非仅命令退出码 0）；alembic 改输出格式时此处可见地红
          alembic current | grep -q "(head)" \
            || { echo "::error::re-upgrade 未回到 head"; exit 1; }

  secret-scan:
    name: Secret scan (gitleaks 等价)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          SECRET_PATTERNS = [
              re.compile(r"sk-[A-Za-z0-9]{20,}"),                    # OpenAI-style keys
              re.compile(r"AKIA[0-9A-Z]{16}"),                       # AWS access key id
              re.compile(r"sk_live_[A-Za-z0-9]{20,}"),               # Stripe live keys
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY"),  # private keys
          ]
          SKIP_SUFFIXES = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".lock", ".woff", ".woff2"}

          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if any(part.startswith(".") and part != ".github" for part in path.parts):
                  continue  # 跳过 .git/.venv 等
              if path.suffix.lower() in SKIP_SUFFIXES or not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for lineno, line in enumerate(content.splitlines(), 1):
                  if any(p.search(line) for p in SECRET_PATTERNS):
                      hits.append(f"{path}:{lineno}")

          if hits:
              print("::error::疑似真实密钥泄漏（请改用 secret 注入）:")
              for h in hits:
                  print(f"  - {h}")
              sys.exit(1)

          # .env.example 的 JWT_SECRET 必须是占位符
          env_example = pathlib.Path("backend/.env.example")
          if env_example.exists():
              text = env_example.read_text(encoding="utf-8")
              for key in ("JWT_SECRET", "LITELLM_MASTER_KEY"):
                  bad = [ln for ln in text.splitlines()
                         if ln.startswith(f"{key}=") and not ln.endswith("__CHANGE_ME__")]
                  if bad:
                      print(f"::error::{key} 必须为占位符 __CHANGE_ME__: {bad}")
                      sys.exit(1)

          print("OK: 未发现真实密钥，.env.example 全为占位符")
          PY

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, frontend, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: lingxi-backend:ci
      - name: Validate docker-compose
        working-directory: backend
        run: docker compose config --quiet


  # ═══════════════════════════════════════════════════════════════════
  # P1-③ 评测门禁（2026-08-26 落地）：report-only 阶段
  # 背景：P1-② 基线复现后 faithfulness/recall 无 CI 门禁，靠人肉跑脚本易回归。
  # 当前 air 结果（qa 82.1% / refuse 87.5% / 引用 21.4%）未达契约阈值
  # （85% / 90% / 95%），故本 job 先 report-only（continue-on-error=true），
  # 只报告不阻塞；优化达标后移除 continue-on-error 转硬门禁（block）。
  # 数据源全在仓库内：eval-and-samples/（评测集）+ kb/ + kb-pdf/（知识库），
  # 与生产 KB 同源（smoke_import 导入）；唯一外部依赖=LLM key，经 GitHub
  # Secrets(ZHIPU_API_KEY) 注入，未配置时 faithfulness 自动跳过并告警。
  eval:
    name: Eval gate (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      EVAL_KB_NAME: "星河智家·官方政策库"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        run: alembic upgrade head
      # 导入评测知识库（eval-and-samples/kb/ + kb-pdf/，sha256 幂等）。
      # smoke_import 建库名为「星河智家·官方政策库」，评测脚本经 --kb-name 对齐。
      - name: Import eval KB (kb/ + kb-pdf/)
        run: python -m scripts.smoke_import
      # recall@5：检索层，无 LLM，不依赖 key。契约阈值 recall@5 >= 85%。
      - name: Recall eval (recall@5 >= 85%)
        run: |
          python -m scripts.eval_recall --kb-name "$EVAL_KB_NAME" \
            || { echo "::warning::recall@5 未达 85%（report-only，暂不阻塞）"; }
      # faithfulness：真实 LLM 调用（glm-4.5-air）。缺 ZHIPU_API_KEY 时跳过并告警，
      # 不 fail（report-only）；配置 Secrets 后自动生效完整门禁。
      - name: Faithfulness eval (needs ZHIPU_API_KEY)
        if: env.ZHIPU_API_KEY != ''
        run: |
          python -m scripts.eval_faithfulness --kb-name "$EVAL_KB_NAME" \
            || { echo "::warning::faithfulness 未达契约阈值 85%/90%/95%（report-only，暂不阻塞）"; }
      - name: Faithfulness skipped (missing ZHIPU_API_KEY)
        if: env.ZHIPU_API_KEY == ''
        run: echo "::warning::未配置 GitHub Secrets ZHIPU_API_KEY，faithfulness 门禁未执行；请配置后开启完整门禁。"

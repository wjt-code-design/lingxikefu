# Lingxi CI：后端 lint(ruff) → 单测(pytest) → 前端(tsc+vitest) → secret 扫描 → 构建镜像
# 红线⑨：day1 必须有 CI + 单测基线；禁止提交真实密钥/endpoint。
#
# ⚠️ 2026-08-23 修复"幻影 CI"：本文件此前位于 backend/.github/workflows/——GitHub Actions
# 只读仓库根的 .github/workflows/，导致全部 4 个 job 从未在远端执行过（硬编码密钥与
# ruff 违规得以推上远端而"CI 绿线"毫无反应）。移至根目录并补上前端 job。
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # 锁定已验证版本：浮动范围会被新版 ruff 的新规则打破（2026-08-22 曾全仓翻红）
        run: pip install "ruff==0.16.4"
      - name: Ruff check
        run: ruff check app tests alembic scripts

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    # A1：真实基础设施 services（PG/Redis/Qdrant）——此前 CI 无 services，
    # pytest 在 runner 上连 localhost 必失败，所有测试验证只能靠本机。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      # CI 测试专用密钥（非生产）：config.validate() fail-closed 要求 JWT_SECRET/LITELLM_MASTER_KEY 非空非占位符，
      # 缺失会导致 app.main import 即抛 ValueError，pytest collection 崩（run#2 已实证）
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      LITELLM_MASTER_KEY: ci-test-litellm-master-key-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        run: alembic upgrade head
      # bge 预下载：seed_demo_data 与部分 pytest 需本地 embedding（bge-base-zh-v1.5），
      # 全新 runner 无 HF 缓存且 embedding.py 以离线加载，缺缓存会 LocalEntryNotFoundError 秒崩
      # （2026-08-27 实测 seed 阶段 8 处 huggingface 报错）。本 step 与 eval job 同款，不得设 HF_HUB_OFFLINE。
      - name: Pre-download embedding model (bge-base-zh-v1.5)
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-base-zh-v1.5'); print('bge model cached OK')"
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
      # 订单集成回归（test_demo_orders.py）需要 KB 有订单 demo 数据；全新空库下脚本自动建 demo KB。
      # 幂等（sha256 去重），可安全在每次 CI 前执行。
      - name: Seed demo KB order data
        run: python scripts/seed_demo_data.py
      - name: Run tests (coverage >= 70%)
        run: pytest
      # 契约门禁：根 contracts/api.ts vs api-schema.json 一致（防漂移静默回归，纯标准库脚本）
      - name: Contract check (check_contracts.py)
        run: python ../scripts/check_contracts.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: backend/coverage.xml

  # T2：迁移 down/up 对称性验证——此前 CI 只验 fresh upgrade（test job），
  # downgrade 路径从未在任何受控环境跑过（生产第一次回滚才是首跑=高危盲区）。
  # 独立空库 PG 上 upgrade→downgrade(-1)→re-upgrade 循环，并硬断言终态回到 head；
  # downgrade 用相对 -1 不写死版本号，新增迁移时本 job 零维护。
  migrations:
    name: Migration down/up symmetry (PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one revision
        run: alembic downgrade -1
      - name: Re-upgrade and assert back at head
        run: |
          alembic upgrade head
          # 断言终态 revision=head（而非仅命令退出码 0）；alembic 改输出格式时此处可见地红
          alembic current | grep -q "(head)" \
            || { echo "::error::re-upgrade 未回到 head"; exit 1; }

  secret-scan:
    name: Secret scan (gitleaks 等价)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          SECRET_PATTERNS = [
              re.compile(r"sk-[A-Za-z0-9]{20,}"),                    # OpenAI-style keys
              re.compile(r"AKIA[0-9A-Z]{16}"),                       # AWS access key id
              re.compile(r"sk_live_[A-Za-z0-9]{20,}"),               # Stripe live keys
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY"),  # private keys
          ]
          SKIP_SUFFIXES = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".lock", ".woff", ".woff2"}

          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if any(part.startswith(".") and part != ".github" for part in path.parts):
                  continue  # 跳过 .git/.venv 等
              if path.suffix.lower() in SKIP_SUFFIXES or not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for lineno, line in enumerate(content.splitlines(), 1):
                  if any(p.search(line) for p in SECRET_PATTERNS):
                      hits.append(f"{path}:{lineno}")

          if hits:
              print("::error::疑似真实密钥泄漏（请改用 secret 注入）:")
              for h in hits:
                  print(f"  - {h}")
              sys.exit(1)

          # .env.example 的 JWT_SECRET 必须是占位符
          env_example = pathlib.Path("backend/.env.example")
          if env_example.exists():
              text = env_example.read_text(encoding="utf-8")
              for key in ("JWT_SECRET", "LITELLM_MASTER_KEY"):
                  bad = [ln for ln in text.splitlines()
                         if ln.startswith(f"{key}=") and not ln.endswith("__CHANGE_ME__")]
                  if bad:
                      print(f"::error::{key} 必须为占位符 __CHANGE_ME__: {bad}")
                      sys.exit(1)

          print("OK: 未发现真实密钥，.env.example 全为占位符")
          PY

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, frontend, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: lingxi-backend:ci
      # docker-compose 的 api/migrate/worker 引用 env_file `- .env`（被 gitignore，CI 不存在），
      # 直接 compose config 会因缺文件报错。用 .env.example（全占位符）生成一个仅用于语法校验。
      - name: Prep .env for compose validation
        working-directory: backend
        run: cp .env.example .env
      - name: Validate docker-compose
        working-directory: backend
        run: docker compose config --quiet


  # ═══════════════════════════════════════════════════════════════════
  # P1-③ 评测门禁（2026-08-26 落地 report-only；2026-08-27 转硬门禁）
  # 契约阈值：recall@5 ≥ 85%（eval_recall）、问答 faithfulness ≥ 85% 且
  # 诚实性拒答率 ≥ 90%（eval_faithfulness）；任一未达或 step 未执行 → job 失败 → 阻断 CI。
  # 历史教训（2026-08-27）：曾用 continue-on-error + `|| echo 警告` 吞错，导致
  # faithfulness 在 CI 全题 ModelNotConfiguredError（CHAT_PROVIDER 默认 bailian 缺
  # DASHSCOPE_API_KEY）也显示"绿"——假绿。故转硬门禁时固定 CHAT_PROVIDER=zhipu 并去吞错。
  # 数据源全在仓库内：eval-and-samples/（评测集）+ kb/ + kb-pdf/（知识库），
  # 与生产 KB 同源（smoke_import 导入）。LLM 走智谱 GLM，Key 经 GitHub
  # Secrets(ZHIPU_API_KEY) 注入；未配置 key 时 faithfulness step 显式失败（没跑=不过）。
  eval:
    name: Eval gate (hard)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
          POSTGRES_DB: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi
      POSTGRES_DB: lingxi
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      # CI 测试专用密钥（非生产）：config.validate() fail-closed 要求 JWT_SECRET/LITELLM_MASTER_KEY 非空非占位符
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      LITELLM_MASTER_KEY: ci-test-litellm-master-key-0123456789abcdef0123456789abcdef
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      # 评测 LLM 固定走智谱（默认 bailian 需 DASHSCOPE_API_KEY，CI 仅有 ZHIPU_API_KEY，
      # 此前全题 ModelNotConfiguredError 被吞成假绿——2026-08-27 修复）
      CHAT_PROVIDER: zhipu
      # 显式指定智谱模型：glm-5.1（代码默认）在评测时全量 429（额度/模型档位不可用，2026-08-27 实测），
      # 按对话文档约定改用 glm-4.7 试跑
      ZHIPU_CHAT_MODEL: "glm-4.7"
      EVAL_KB_NAME: "星河智家·官方政策库"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh PG)
        run: alembic upgrade head
      # bge 模型预下载：CI 全新 runner 无 HF 缓存，而 embedding.py 以 HF_HUB_OFFLINE=1 强制离线加载，
      # 无缓存会 OSError 秒崩（run#2 已实证）。此处先行在线下载（经 hf-mirror 镜像），
      # 落盘后 smoke_import 内 setdefault 设离线可命中缓存。注意本 step 不得设置 HF_HUB_OFFLINE。
      - name: Pre-download embedding model (bge-base-zh-v1.5)
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-base-zh-v1.5'); print('bge model cached OK')"
        # run#3 实证：hf-mirror.com 国内镜像在 GitHub 海外 runner 上 6s 超时失败；
        # 移除 HF_ENDPOINT，走默认直连 huggingface.co（海外 runner 可达），下载 bge 落缓存
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
      # 导入评测知识库（eval-and-samples/kb/ + kb-pdf/，sha256 幂等）。
      # smoke_import 建库名为「星河智家·官方政策库」，评测脚本经 --kb-name 对齐。
      - name: Import eval KB (kb/ + kb-pdf/)
        run: python -m scripts.smoke_import
      # recall@5：检索层，无 LLM，不依赖 key。契约阈值 recall@5 >= 85%。
      - name: Recall eval (recall@5 >= 85%)
        run: python -m scripts.eval_recall --kb-name "$EVAL_KB_NAME"
      # faithfulness：真实 LLM 调用（智谱 GLM，走 CHAT_PROVIDER=zhipu）。
      # 硬门禁：未达阈值脚本 exit 1 → step 失败 → 阻断 CI。
      # CI 用确定性均匀抽样 20 题（跨位置覆盖各主题、每次同一批可对比）；
      # 全量 100 题在智谱上单轮 2h+ 不可行（2026-08-27 实测取消），
      # 全量评测保留手动：python -m scripts.eval_faithfulness --kb-name "$EVAL_KB_NAME"
      - name: Faithfulness eval (qa >= 85% / refuse >= 90%, sample 20)
        if: env.ZHIPU_API_KEY != ''
        run: python -m scripts.eval_faithfulness --sample 20 --kb-name "$EVAL_KB_NAME"
      # 未配置 LLM Key = 门禁无法执行 = 显式失败（fail-closed，杜绝"没跑算过"假绿）
      - name: Faithfulness skipped (missing ZHIPU_API_KEY) => FAIL
        if: env.ZHIPU_API_KEY == ''
        run: |
          echo "::error::未配置 GitHub Secrets ZHIPU_API_KEY，faithfulness 门禁未执行（fail-closed）"
          exit 1
